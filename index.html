<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Сорока</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Сорока — мессенджер.
   Раскладка: список чатов | диалог | сведения (выезжают справа). На телефоне одна колонка со сменой экранов. */
:root{
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-brand:"Unbounded","Golos Text",system-ui,sans-serif;

  --bg:#ECF0F2; --panel:#FFFFFF; --panel-2:#F1F4F6; --panel-3:#E5EBEE;
  --ink:#0F181C; --mute:#5E6D76; --line:#DCE3E7;
  --accent:#0B7C87; --accent-ink:#FFFFFF; --accent-text:#0A6C76; --accent-soft:#D6EDEF;
  --link:#0B62A6;
  --in:#FFFFFF; --in-ink:#0F181C; --in-mute:#6B7A83;
  --out:#CFECEA; --out-ink:#0A2326; --out-mute:#3F6C70;
  --quote-in:#EEF3F5; --quote-out:#B9E1DF;
  --wall:#DCE6E7; --wall-dot:rgba(11,124,135,.11);
  --ok:#2E9E5E; --danger:#CF4339; --scrim:rgba(8,16,20,.46);
  --shadow:0 1px 1.5px rgba(16,40,50,.16);
  --pop:0 10px 34px rgba(8,24,32,.22),0 1px 3px rgba(8,24,32,.12);
  --chip:rgba(11,124,135,.10); --chip-on:rgba(11,124,135,.26);
  --n0:#B3322A; --n1:#955700; --n2:#33761A; --n3:#0A6C76; --n4:#1B67A0; --n5:#4650BE; --n6:#8140B0; --n7:#AB3170;
  --a0:#D8503F; --a1:#B8730B; --a2:#3F8A22; --a3:#0F8B8D; --a4:#2B7CBF; --a5:#5B63D6; --a6:#9552C4; --a7:#C24580;
  --fs-msg:15.5px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1114; --panel:#12191D; --panel-2:#1A2328; --panel-3:#222E34;
    --ink:#E7EEF1; --mute:#8D9DA6; --line:#233038;
    --accent:#128590; --accent-ink:#FFFFFF; --accent-text:#59CDD4; --accent-soft:#143A40;
    --link:#7CC4FF;
    --in:#1D282E; --in-ink:#E7EEF1; --in-mute:#8D9DA6;
    --out:#0F5A62; --out-ink:#EAFBFC; --out-mute:#9ACFD3;
    --quote-in:#26343B; --quote-out:#0B484F;
    --wall:#0A0F12; --wall-dot:rgba(89,205,212,.07);
    --ok:#43C47D; --danger:#F06B60; --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 1.5px rgba(0,0,0,.45);
    --pop:0 12px 36px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
    --chip:rgba(89,205,212,.13); --chip-on:rgba(89,205,212,.30);
    --n0:#FF8F82; --n1:#F2B556; --n2:#98D673; --n3:#59CDD4; --n4:#78BDF3; --n5:#A3ABFF; --n6:#CF9DF4; --n7:#F590BE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1114; --panel:#12191D; --panel-2:#1A2328; --panel-3:#222E34;
  --ink:#E7EEF1; --mute:#8D9DA6; --line:#233038;
  --accent:#128590; --accent-ink:#FFFFFF; --accent-text:#59CDD4; --accent-soft:#143A40;
  --link:#7CC4FF;
  --in:#1D282E; --in-ink:#E7EEF1; --in-mute:#8D9DA6;
  --out:#0F5A62; --out-ink:#EAFBFC; --out-mute:#9ACFD3;
  --quote-in:#26343B; --quote-out:#0B484F;
  --wall:#0A0F12; --wall-dot:rgba(89,205,212,.07);
  --ok:#43C47D; --danger:#F06B60; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1.5px rgba(0,0,0,.45);
  --pop:0 12px 36px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  --chip:rgba(89,205,212,.13); --chip-on:rgba(89,205,212,.30);
  --n0:#FF8F82; --n1:#F2B556; --n2:#98D673; --n3:#59CDD4; --n4:#78BDF3; --n5:#A3ABFF; --n6:#CF9DF4; --n7:#F590BE;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font:400 15px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--link)}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
::selection{background:var(--chip-on)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]:not([hidden=until-found i]){display:none!important}

/* ───── каркас ───── */
#app{
  position:relative;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);
  height:100%;overflow:hidden;background:var(--bg);
}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.main{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--wall);overflow:hidden}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.ibtn{
  display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;
  color:var(--mute);flex:none;transition:background .15s,color .15s;position:relative;
}
.ibtn:hover{background:var(--panel-2);color:var(--ink)}
.ibtn:active{background:var(--panel-3)}
.ibtn[disabled]{opacity:.4;pointer-events:none}
.ibtn.on{color:var(--accent-text);background:var(--accent-soft)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;
  border-radius:12px;background:var(--panel-2);color:var(--ink);font-weight:600;font-size:14.5px;
  transition:background .15s,filter .15s,transform .05s;
}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger:hover{background:rgba(207,67,57,.10)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ───── аватары ───── */
.av{
  --s:48px;position:relative;display:inline-grid;place-items:center;flex:none;
  width:var(--s);height:var(--s);border-radius:50%;color:#fff;font-weight:600;
  font-size:calc(var(--s)*.38);line-height:1;letter-spacing:.2px;user-select:none;
  background:var(--a3);
}
.av.c0{background:var(--a0)}.av.c1{background:var(--a1)}.av.c2{background:var(--a2)}.av.c3{background:var(--a3)}
.av.c4{background:var(--a4)}.av.c5{background:var(--a5)}.av.c6{background:var(--a6)}.av.c7{background:var(--a7)}
.av.emo{font-size:calc(var(--s)*.5);font-weight:400}
.av.logo{background:#0B6E78;padding:0;overflow:hidden}
.av.logo svg{width:100%;height:100%;display:block}
.av.bot{background:linear-gradient(140deg,#16A0A8,#5B63D6)}
.av.bot .ic{width:56%;height:56%;stroke:none;fill:#fff}
.av.save{background:linear-gradient(140deg,#2B7CBF,#5B63D6)}
.av.save .ic{width:50%;height:50%;stroke:#fff}
.av .dot{
  position:absolute;right:-1px;bottom:-1px;width:calc(var(--s)*.27);height:calc(var(--s)*.27);min-width:10px;min-height:10px;
  border-radius:50%;background:var(--ok);border:2.5px solid var(--panel);
}

/* ───── боковая колонка ───── */
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:60px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none;display:block}
.brand b{font:700 17px/1 var(--font-brand);letter-spacing:.2px}
.side-actions{display:flex;gap:2px}
.search{
  display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:20px;
  background:var(--panel-2);color:var(--mute);transition:box-shadow .15s,background .15s;
}
.search:focus-within{background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.search .ic{width:18px;height:18px}
.side-search{padding-bottom:8px;flex:none}
.tabs{display:flex;gap:6px;padding-bottom:8px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;height:32px;padding:0 14px;border-radius:16px;font-size:13.5px;font-weight:600;color:var(--mute);
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s;
}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab.on{background:var(--accent-soft);color:var(--accent-text)}
.tab i{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;display:inline-grid;place-items:center}
.net{
  margin:0 12px 6px;padding:8px 12px;border-radius:10px;background:rgba(201,138,27,.14);
  color:var(--ink);font-size:13px;flex:none;
}
.list{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:2px max(6px,env(safe-area-inset-right,0px)) 12px max(6px,env(safe-area-inset-left,0px));
}
.list-sec{padding:12px 10px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.row{
  display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:14px;text-align:left;
  transition:background .12s;position:relative;
}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--accent);color:var(--accent-ink)}
.row.on .rpv,.row.on .rtime{color:rgba(255,255,255,.82)}
.row.on .badge{background:#fff;color:var(--accent)}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r1,.r2{display:flex;align-items:center;gap:8px;min-width:0}
.rt{flex:1;min-width:0;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{flex:none;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.rpv{flex:1;min-width:0;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpv b{font-weight:500;color:var(--ink)}
.row.on .rpv b{color:#fff}
.rpv .draft{color:var(--danger);font-weight:500}
.row.on .rpv .draft{color:#fff}
.rpv.typing,.rpv .typ{color:var(--accent-text);font-weight:500}
.row.on .rpv.typing{color:#fff}
.badge{
  flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  font-size:12.5px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;
}
.row-tick{flex:none;color:var(--accent-text);display:inline-flex}
.row.on .row-tick{color:#fff}
.row-tick .ic{width:17px;height:17px}
.list-empty{padding:28px 20px;text-align:center;color:var(--mute);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.skel{display:flex;align-items:center;gap:12px;padding:10px 10px}
.skel i{display:block;border-radius:8px;background:var(--panel-2);animation:shim 1.4s ease-in-out infinite}
.skel .c{width:48px;height:48px;border-radius:50%}
.skel .l1{height:13px;width:46%}
.skel .l2{height:11px;width:72%;margin-top:9px}
.skel>div{flex:1}
@keyframes shim{0%,100%{opacity:.55}50%{opacity:1}}

/* ───── пустое состояние справа ───── */
.empty-main{flex:1;display:grid;place-items:center;padding:24px;text-align:center}
.empty-main>div{max-width:330px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-main .big{width:84px;height:84px;border-radius:24px;overflow:hidden;box-shadow:var(--pop)}
.empty-main .big svg{width:100%;height:100%;display:block}
.empty-main h2{font:700 20px/1.25 var(--font-brand);text-wrap:balance}
.empty-main p{color:var(--mute);font-size:14.5px;text-wrap:pretty}
.empty-main .pill{background:var(--panel);padding:6px 14px;border-radius:999px;font-size:13px;color:var(--mute);box-shadow:var(--shadow)}
/* ───── диалог ───── */
.chat{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;height:60px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);z-index:3}
.chat-head .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:4px 6px 4px 0;border-radius:12px;text-align:left}
.chat-head .who:hover .ch-title{color:var(--accent-text)}
.ch-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.ch-title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s}
.ch-sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub.live{color:var(--accent-text)}
.back{display:none}
.searchbar{display:flex;align-items:center;gap:4px;height:52px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);z-index:3}
.searchbar .search{flex:1;min-width:0}
.searchbar .cnt{font-size:13px;color:var(--mute);min-width:0;flex:none;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.searchbar .ibtn{width:38px;height:38px}

.msgs{
  position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-top:10px;padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 1px 1px,var(--wall-dot) 1px,transparent 1.5px) 0 0/22px 22px,var(--wall);
}
.thread{position:relative;display:flex;flex-direction:column;max-width:820px;margin:0 auto;min-height:100%;justify-content:flex-end}
.day{align-self:center;margin:10px 0 6px;padding:3px 12px;border-radius:999px;background:rgba(20,40,48,.46);color:#fff;font-size:12.5px;font-weight:500;position:sticky;top:4px;z-index:2;backdrop-filter:blur(4px)}
.unread-div{align-self:stretch;margin:10px -16px 6px;padding:5px 16px;text-align:center;background:rgba(20,40,48,.34);color:#fff;font-size:12.5px;font-weight:500}
.load-more{align-self:center;margin:4px 0 8px;padding:6px 14px;border-radius:999px;background:var(--panel);color:var(--accent-text);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.load-more:hover{background:var(--panel-2)}

.m{display:flex;align-items:flex-end;gap:8px;margin-top:8px;max-width:100%;position:relative}
.m.cont{margin-top:2px}
.m.out{justify-content:flex-end}
.m-av{width:34px;flex:none;align-self:flex-end}
.m-av .av{--s:34px}
.m.flash .b{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent),var(--shadow);filter:brightness(1.12)}100%{box-shadow:0 0 0 12px transparent,var(--shadow)}}
.bw{position:relative;max-width:min(560px,86%);min-width:0;display:flex;flex-direction:column}
.m.out .bw{align-items:flex-end}
.b{
  --b-bg:var(--in);position:relative;min-width:0;max-width:100%;padding:6px 11px 6px;border-radius:16px;
  background:var(--b-bg);color:var(--in-ink);box-shadow:var(--shadow);overflow-wrap:anywhere;
  font-size:var(--fs-msg);line-height:1.38;
}
.m.out .b{--b-bg:var(--out);color:var(--out-ink)}
.m.in.cont-prev .b{border-top-left-radius:6px}
.m.in.cont-next .b{border-bottom-left-radius:6px}
.m.out.cont-prev .b{border-top-right-radius:6px}
.m.out.cont-next .b{border-bottom-right-radius:6px}
.b.tail{border-bottom-left-radius:16px;border-bottom-right-radius:16px}
.m.in .b.tail{border-bottom-left-radius:4px}
.m.out .b.tail{border-bottom-right-radius:4px}
.b.tail::before{content:"";position:absolute;bottom:0;width:10px;height:14px;background:var(--b-bg);clip-path:path("M10 0 L10 14 L2 14 C6 13 9.4 9 10 0 Z")}
.m.in .b.tail::before{left:-9px}
.m.out .b.tail::before{right:-9px;transform:scaleX(-1)}
.nm{font-weight:600;font-size:13.5px;line-height:1.25;margin-bottom:1px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.nm:hover{text-decoration:underline}
.x{white-space:pre-wrap;word-break:break-word}
.x a{color:var(--link);text-decoration:none;overflow-wrap:anywhere}
.x a:hover{text-decoration:underline}
.x code{font:500 .9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1px 5px;border-radius:5px;background:rgba(10,40,48,.10)}
.x pre{margin:4px 0;padding:8px 10px;border-radius:8px;background:rgba(10,40,48,.10);overflow-x:auto;white-space:pre}
.x pre code{background:none;padding:0}
.spoiler{border-radius:4px;background:var(--mute);color:transparent;cursor:pointer;user-select:none;transition:background .2s,color .2s}
.spoiler.open{background:transparent;color:inherit;user-select:text}
.sp{display:inline-block;visibility:hidden;font-size:11.5px;white-space:nowrap;padding-left:10px;height:1px}
.meta{
  position:absolute;right:9px;bottom:4px;display:inline-flex;align-items:center;gap:3px;
  font-size:11.5px;color:var(--in-mute);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1;
}
.m.out .meta{color:var(--out-mute)}
.meta .ed{margin-right:2px}
.meta .tk{display:inline-flex;color:var(--out-mute)}
.meta .tk.read{color:var(--accent-text)}
.m.out .meta .tk.read{color:#0E7C86}
.meta .tk .ic{width:15px;height:15px;stroke-width:2.2}
.meta .tk.err{color:var(--danger)}
.q{
  display:block;width:100%;margin:2px 0 5px;padding:3px 8px;border-left:3px solid var(--accent-text);border-radius:3px 7px 7px 3px;
  background:var(--quote-in);text-align:left;cursor:pointer;min-width:120px;
}
.m.out .q{background:var(--quote-out)}
.q b{display:block;font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q span{display:block;font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.86}
.big-emo .b{background:transparent;box-shadow:none;padding:0 4px 14px;font-size:46px;line-height:1.15}
.big-emo .b::before{display:none}
.big-emo .meta{background:rgba(20,40,48,.46);color:#fff;border-radius:10px;padding:2px 6px;right:2px;bottom:0}
.big-emo .sp{display:none}
.b.has-img{padding:3px}
.b.has-img .x,.b.has-img .nm{padding:2px 8px 0}
.b.has-img .q{margin:4px 5px 5px;width:auto}
.b.has-img.cap .x{padding-bottom:4px}
.media{position:relative;display:block;border-radius:13px;overflow:hidden;background:var(--panel-3);cursor:zoom-in;max-width:100%}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.media .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(8px);transform:scale(1.1)}
.media .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12.5px}
.b.has-img:not(.cap) .meta{background:rgba(20,40,48,.55);color:#fff;border-radius:10px;padding:2px 6px;right:9px;bottom:9px}
.b.has-img:not(.cap) .meta .tk{color:#fff}
.b.has-img:not(.cap) .sp{display:none}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px;padding-right:58px;min-height:24px}
.rx{
  display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:var(--chip);
  font-size:13px;font-weight:600;color:var(--ink);transition:background .12s;
}
.m.out .rx{color:var(--out-ink)}
.rx:hover{background:var(--chip-on)}
.rx.mine{background:var(--accent);color:var(--accent-ink)}
.rx i{font-style:normal;font-size:14px;line-height:1}
.b.has-rx .sp{display:none}
.b.has-rx{padding-bottom:6px}
.b.has-rx .meta{bottom:7px}
.tools{
  position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:2px;padding:2px;border-radius:999px;
  background:var(--panel);box-shadow:var(--pop);opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;
}
.m.out .tools{right:calc(100% + 8px)}
.m.in .tools{left:calc(100% + 8px)}
.tools .ibtn{width:30px;height:30px}
.tools .ic{width:17px;height:17px}
@media (hover:hover){.m:hover .tools{opacity:1;pointer-events:auto}}
.m.sel .b{outline:2px solid var(--accent)}
.m.found .b{outline:2px solid #E0A526}
.m.found.cur .b{outline:3px solid #E0A526;box-shadow:0 0 0 6px rgba(224,165,38,.25)}

.chat-empty{
  position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none;
}
.chat-empty>div{pointer-events:auto;max-width:300px;padding:18px 20px;border-radius:18px;background:var(--panel);box-shadow:var(--pop);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.chat-empty p{color:var(--mute);font-size:14px}
.chat-empty b{font-size:15.5px}
.typing-dots{display:inline-flex;gap:3px;align-items:center;margin-left:2px}
.typing-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dots 1.1s infinite ease-in-out}
.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.m.bot-typing .b{min-width:62px;min-height:34px}
.tobottom{
  position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:84px;width:44px;height:44px;border-radius:50%;
  background:var(--panel);color:var(--mute);box-shadow:var(--pop);display:grid;place-items:center;z-index:4;
  transition:opacity .15s,transform .15s;
}
.tobottom:hover{color:var(--ink)}
.tobottom[hidden]{display:none}
.tobottom .badge{position:absolute;top:-8px;right:-4px}

/* ───── поле ввода ───── */
.composer{flex:none;background:var(--panel);border-top:1px solid var(--line);position:relative;z-index:3}
.cbar{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:0}
.cbar .ic{color:var(--accent-text)}
.cbar .ctext{flex:1;min-width:0;border-left:3px solid var(--accent-text);padding:1px 10px;display:flex;flex-direction:column}
.cbar .ctext b{font-size:13px;color:var(--accent-text);font-weight:600}
.cbar .ctext span{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach-prev{display:flex;gap:10px;align-items:center;padding-top:8px;padding-bottom:0}
.attach-prev .thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--panel-3)}
.attach-prev .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-prev small{color:var(--mute);font-size:13px;flex:1}
.crow{display:flex;align-items:flex-end;gap:6px;padding-top:8px;padding-bottom:10px}
.ta-wrap{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--panel-2);border-radius:22px;padding:0 4px 0 6px;transition:box-shadow .15s}
.ta-wrap:focus-within{box-shadow:0 0 0 2px var(--accent)}
.ta-wrap textarea{
  flex:1;min-width:0;max-height:168px;min-height:44px;resize:none;border:0;outline:none;background:none;
  padding:11px 6px;line-height:22px;font-size:15.5px;color:var(--ink);
}
.ta-wrap textarea::placeholder{color:var(--mute)}
.ta-wrap .ibtn{width:38px;height:38px;margin-bottom:3px}
.send{
  flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  transition:filter .15s,transform .1s,opacity .15s;
}
.send:hover{filter:brightness(1.1)}
.send:active{transform:scale(.94)}
.send[disabled]{background:var(--panel-3);color:var(--mute);pointer-events:none}
.send .ic{width:20px;height:20px;margin-left:2px}
.ro-note{padding-top:14px;padding-bottom:14px;text-align:center;color:var(--mute);font-size:14px}
.emoji-panel{
  position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(100% + 8px);width:min(344px,calc(100% - 24px));height:320px;
  background:var(--panel);border-radius:18px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;z-index:15;
}
.emoji-tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.emoji-tabs button{flex:none;width:36px;height:34px;border-radius:9px;font-size:19px;display:grid;place-items:center;opacity:.6}
.emoji-tabs button:hover{background:var(--panel-2);opacity:1}
.emoji-tabs button.on{background:var(--accent-soft);opacity:1}
.emoji-grid{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;align-content:start}
.emoji-grid h4{grid-column:1/-1;margin:6px 4px 2px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.emoji-grid button{height:36px;border-radius:9px;font-size:23px;line-height:1;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emoji-grid button:hover{background:var(--panel-2)}

.sys{align-self:center;margin:10px 0 4px;padding:3px 12px;border-radius:999px;background:rgba(20,40,48,.46);color:#fff;font-size:12.5px;max-width:92%;text-align:center;text-wrap:balance}
.badge.muted{background:var(--mute)}
.pinbar{display:flex;align-items:center;gap:6px;min-height:46px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);z-index:3}
.pin-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:4px 0;color:var(--accent-text)}
.pin-t{display:flex;flex-direction:column;min-width:0;border-left:2px solid var(--accent-text);padding-left:8px}
.pin-t b{font-size:13px;font-weight:600;color:var(--accent-text)}
.pin-t span{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q b{color:var(--accent-text)}
.attach-prev .ibtn{margin-left:auto}
.tmp .b{min-width:62px}
/* ───── сведения о чате ───── */
.info{
  position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);display:flex;flex-direction:column;background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(104%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s;z-index:12;
  box-shadow:var(--pop);
}
.info.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s}
.info-head{display:flex;align-items:center;gap:8px;height:60px;flex:none;border-bottom:1px solid var(--line)}
.info-head h3{flex:1;font-size:17px;font-weight:600}
.info-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 20px 16px}
.prof .av{--s:96px;margin-bottom:6px}
.prof h2{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.prof .sub{font-size:14px;color:var(--mute)}
.prof .sub.live{color:var(--accent-text)}
.prof .about{margin-top:8px;font-size:14.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty}
.sect{padding:8px 8px 0}
.sect-t{padding:8px 12px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.member{display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;border-radius:12px}
.member:hover{background:var(--panel-2)}
.member .av{--s:42px}
.member .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.member b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member small{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member small.live{color:var(--accent-text)}
.member .tag{flex:none;font-size:12px;color:var(--accent-text);background:var(--accent-soft);padding:2px 9px;border-radius:10px;font-weight:600}
.info-actions{padding:10px 12px 0;display:flex;flex-direction:column;gap:6px}
.info-scrim{display:none}

/* ───── всплывающие слои ───── */
#layer{position:fixed;inset:0;pointer-events:none;z-index:100}
.scrim{
  position:fixed;inset:0;background:var(--scrim);pointer-events:auto;display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));animation:fade .15s ease-out;
}
.modal{
  width:min(440px,100%);max-height:min(94%,740px);display:flex;flex-direction:column;background:var(--panel);
  border-radius:22px;box-shadow:var(--pop);overflow:hidden;animation:rise .2s cubic-bezier(.2,.8,.2,1);
}
.modal.wide{width:min(520px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 6px 22px;flex:none}
.modal-head h3{font-size:18px;font-weight:700}
.modal-body{padding:8px 22px 18px;overflow-y:auto;min-height:0;flex:1}
.modal-foot{padding:12px 22px 16px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

.menu{
  position:fixed;min-width:210px;max-width:min(320px,calc(100vw - 16px));padding:6px;background:var(--panel);border-radius:16px;box-shadow:var(--pop);
  pointer-events:auto;z-index:110;animation:pop .12s ease-out;transform-origin:var(--ox,50%) var(--oy,0);border:1px solid var(--line);
}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;font-size:14.5px}
.menu-item:hover,.menu-item:focus-visible{background:var(--panel-2)}
.menu-item .ic{width:19px;height:19px;color:var(--mute)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .ic{color:var(--danger)}
.menu-sep{height:1px;margin:4px 6px;background:var(--line)}
.rxbar{display:flex;gap:2px;padding:2px 2px 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.rxbar button{width:38px;height:38px;border-radius:10px;font-size:23px;line-height:1;display:grid;place-items:center;transition:transform .1s,background .1s}
.rxbar button:hover{background:var(--panel-2);transform:scale(1.15)}
.rxbar button.on{background:var(--accent-soft)}

.toasts{
  position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:120;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
}
.toast{
  pointer-events:auto;max-width:min(440px,100%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;
  box-shadow:var(--pop);font-size:14px;display:flex;gap:10px;align-items:center;animation:drop .22s cubic-bezier(.2,.8,.2,1);
}
.toast.msg{background:var(--panel);color:var(--ink);cursor:pointer;border:1px solid var(--line);padding:9px 14px 9px 10px;min-width:260px}
.toast.msg .av{--s:38px}
.toast.msg .tt{display:flex;flex-direction:column;min-width:0}
.toast.msg b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.msg span{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .act{margin-left:6px;font-weight:700;color:var(--accent-text)}
.toast.err{background:var(--danger);color:#fff}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:130;animation:fade .15s;pointer-events:auto;padding:16px}
.lightbox img{max-width:min(96vw,1500px);max-height:90vh;object-fit:contain;border-radius:6px;background:#111}
.lightbox .ibtn{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));color:#fff;background:rgba(255,255,255,.14)}
.lightbox .ibtn:hover{background:rgba(255,255,255,.24);color:#fff}

/* ───── формы ───── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--mute)}
.inp{height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);outline:none;font-size:15.5px;width:100%;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--chip)}
textarea.inp{height:auto;min-height:76px;padding:11px 14px;resize:vertical;line-height:1.4}
.hint{font-size:12.5px;color:var(--mute)}
.hint.err{color:var(--danger)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .1s}
.sw:hover{transform:scale(1.08)}
.sw .ic{width:18px;height:18px;opacity:0;stroke-width:3}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.sw.on .ic{opacity:1}
.sw.c0{background:var(--a0)}.sw.c1{background:var(--a1)}.sw.c2{background:var(--a2)}.sw.c3{background:var(--a3)}
.sw.c4{background:var(--a4)}.sw.c5{background:var(--a5)}.sw.c6{background:var(--a6)}.sw.c7{background:var(--a7)}
.glyphs{display:flex;flex-wrap:wrap;gap:6px}
.gl{width:40px;height:40px;border-radius:11px;background:var(--panel-2);font-size:21px;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.gl:hover{background:var(--panel-3)}
.gl.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.gl.none{font-size:13px;font-weight:600;font-family:var(--font-ui);color:var(--mute)}
.seg{display:flex;background:var(--panel-2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute);text-align:center}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;width:100%;text-align:left}
.opt small{display:block;color:var(--mute);font-size:13px}
.switch{position:relative;width:46px;height:27px;border-radius:14px;background:var(--panel-3);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(19px)}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:12px}
.pick:hover{background:var(--panel-2)}
.pick .av{--s:42px}
.pick .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.pick b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{font-size:13px;color:var(--mute)}
.pick small.live{color:var(--accent-text)}
.pick .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.pick .chk .ic{width:14px;height:14px;stroke-width:3.2}
.pick.on .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.picklist{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;margin:0 -10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);font-size:13.5px;font-weight:600}
.chip .ic{width:14px;height:14px}

/* ───── вход / знакомство ───── */
.gate{position:absolute;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);animation:fade .25s}
.gate.one{grid-template-columns:minmax(0,1fr);place-items:center}
.bp{
  position:relative;overflow:hidden;color:#E8F5F6;display:flex;flex-direction:column;justify-content:space-between;gap:24px;
  padding:44px max(44px,env(safe-area-inset-left,0px)) 44px max(44px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 90% at 0% 0%,#0F5962 0%,transparent 60%),linear-gradient(165deg,#0B3A41 0%,#08161A 70%);
}
.bp .wm{display:flex;align-items:center;gap:14px}
.bp .wm svg{width:48px;height:48px;border-radius:14px}
.bp .wm b{font:700 28px/1 var(--font-brand);letter-spacing:.3px}
.bp h2{font:700 clamp(26px,3.4vw,40px)/1.15 var(--font-brand);max-width:15ch;text-wrap:balance}
.bp p{color:#A9C7CB;max-width:34ch;font-size:15.5px;margin-top:14px}
.bp .demo{display:flex;flex-direction:column;gap:8px;max-width:340px}
.bp .bub{padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.35;width:fit-content;max-width:100%}
.bp .bub.a{background:#12292F;border-bottom-left-radius:5px}
.bp .bub.b{background:#0F6F78;align-self:flex-end;border-bottom-right-radius:5px}
.bp .bub small{display:block;font-size:12.5px;font-weight:600;color:#6FD3DA;margin-bottom:1px}
.gf{display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;max-width:440px;margin:0 auto;padding:32px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));overflow-y:auto}
.gf h1{font:700 26px/1.2 var(--font-brand);margin-bottom:6px;text-wrap:balance}
.gf .lead{color:var(--mute);margin-bottom:18px;text-wrap:pretty}
.gf .me{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.gf .me .av{--s:64px}
.gcard{max-width:400px;padding:34px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.gcard svg{width:68px;height:68px;border-radius:20px}
.gcard h1{font:700 22px/1.25 var(--font-brand);text-wrap:balance}
.gcard p{color:var(--mute);text-wrap:pretty}
.gf .brand-mini{display:none}

/* ───── телефон: один экран за раз ───── */
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0}
  .main{position:absolute;inset:0;transform:translateX(100%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;z-index:5}
  #app.in-chat .main{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .empty-main{display:none}
  .back{display:inline-grid}
  .tools{display:none}
  .bw{max-width:88%}
  .info{width:100%;box-shadow:none}
  .gate{grid-template-columns:minmax(0,1fr)}
  .bp{display:none}
  .gf .brand-mini{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .gf .brand-mini svg{width:38px;height:38px;border-radius:11px}
  .gf .brand-mini b{font:700 20px/1 var(--font-brand)}

  try {
    const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0;opacity:0', 'aria-hidden': 'true' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* понятные ошибки */
function errText(e, what) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Хранилище заполнено. Удалите старые чаты или фото.';
  if (c === 'resource_exhausted') return 'Слишком часто. Подождите секунду.';
  if (c === 'invalid_argument') return (what ? what + ': ' : '') + 'нет прав на запись.';
  if (c === 'unavailable' || c === 'timeout') return 'Нет связи с хранилищем. Попробуйте ещё раз.';
  if (c === 'revoked') return 'Доступ к странице закрыт.';
  return (what || 'Ошибка') + (e && e.message ? ': ' + e.message : '');
}

/* ===== разметка сообщений: **жирный**, __курсив__, ~~зачёркнутый~~, `код`, ```блок```, ||спойлер||, ссылки ===== */
const FMT = [
  { re: /```([\s\S]+?)```/, make: m => h('pre', null, h('code', { text: m[1].replace(/^\n+|\n+$/g, '') })) },
  { re: /`([^`\n]+)`/, make: m => h('code', { text: m[1] }) },
  { re: /\*\*([^\n]+?)\*\*/, make: m => h('b', null, renderInline(m[1])) },
  { re: /__([^\n]+?)__/, make: m => h('i', null, renderInline(m[1])) },
  { re: /~~([^\n]+?)~~/, make: m => h('s', null, renderInline(m[1])) },
  {
    re: /\|\|([^\n]+?)\|\|/,
    make: m => {
      const s = h('span', { class: 'spoiler', title: 'Нажмите, чтобы показать' }, renderInline(m[1]));
      s.addEventListener('click', e => { e.stopPropagation(); s.classList.toggle('open'); });
      return s;
    },
  },
  { re: /https?:\/\/[^\s<>"'`]+[^\s<>"'`.,;:!?)\]»]/, make: m => h('a', { href: m[0], target: '_blank', rel: 'noopener noreferrer nofollow', text: m[0] }) },
];
function renderInline(text) {
  const frag = document.createDocumentFragment();
  let rest = String(text);
  let guard = 0;
  while (rest && guard++ < 400) {
    let best = null, bi = Infinity;
    for (const f of FMT) {
      const m = f.re.exec(rest);
      if (m && m.index < bi) { best = { f, m }; bi = m.index; }
    }
    if (!best) { frag.append(rest); break; }
    if (bi > 0) frag.append(rest.slice(0, bi));
    frag.append(best.f.make(best.m));
    rest = rest.slice(bi + best.m[0].length);
  }
  if (rest && guard >= 400) frag.append(rest);
  return frag;
}
/* текст без разметки для превью и цитат */
function plainText(s) {
  return String(s || '')
    .replace(/```([\s\S]+?)```/g, '$1').replace(/`([^`\n]+)`/g, '$1')
    .replace(/\*\*([^\n]+?)\*\*/g, '$1').replace(/__([^\n]+?)__/g, '$1')
    .replace(/~~([^\n]+?)~~/g, '$1').replace(/\|\|([^\n]+?)\|\|/g, '▒▒▒');
}

/* ===== локальное хранилище с тем же API, что у db: демо-режим и проверки ===== */
function makeLocalDB(prefix) {
  const docs = new Map(); // путь -> {d, v, snap}
  const watchers = new Set();
  let ver = 0;
  let persistFailed = false;
  let chan = null;
  try { chan = new BroadcastChannel(prefix + ':bus'); } catch (e) { chan = null; }
  const KP = prefix + ':doc:';

  function loadAll() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(KP) === 0) {
          const raw = localStorage.getItem(k);
          if (raw) docs.set(k.slice(KP.length), { d: JSON.parse(raw), v: ++ver, snap: null });
        }
      }
    } catch (e) { /* ignore */ }
  }
  function persist(path, data) {
    try {
      if (data == null) localStorage.removeItem(KP + path);
      else localStorage.setItem(KP + path, JSON.stringify(data));
    } catch (e) { persistFailed = true; }
  }

  function checkPath(path, even) {
    const s = String(path).split('/');
    for (const x of s) {
      if (!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x) || x === '.' || x === '..') throw new TypeError('Недопустимый сегмент пути: ' + path);
    }
    if ((s.length % 2 === 0) !== even) throw new TypeError((even ? 'Документ' : 'Коллекция') + ': неверное число сегментов в ' + path);
    return s;
  }
  const idOf = p => p.slice(p.lastIndexOf('/') + 1);
  const parentOf = p => p.slice(0, p.lastIndexOf('/'));

  function put(path, data, remote) {
    if (data == null) docs.delete(path);
    else docs.set(path, { d: data, v: ++ver, snap: null });
    if (!remote) {
      persist(path, data);
      try { if (chan) chan.postMessage({ p: path, d: data == null ? null : data }); } catch (e) { /* ignore */ }
    }
    for (const w of Array.from(watchers)) if (w.hit(path)) w.run();
  }
  function applyRemote(path, data) {
    const cur = docs.get(path);
    if (data == null && !cur) return;
    if (data != null && cur && JSON.stringify(cur.d) === JSON.stringify(data)) return;
    put(path, data, true);
  }
  if (chan) {
    chan.onmessage = ev => {
      const m = ev.data;
      if (m && typeof m.p === 'string') applyRemote(m.p, m.d);
    };
  }
  /* запись из другой вкладки через localStorage (запасной путь, если BroadcastChannel недоступен) */
  window.addEventListener('storage', ev => {
    if (!ev.key || ev.key.indexOf(KP) !== 0) return;
    let data = null;
    try { data = ev.newValue ? JSON.parse(ev.newValue) : null; } catch (e) { return; }
    applyRemote(ev.key.slice(KP.length), data);
  });

  function docSnap(path) {
    const e = docs.get(path);
    if (e && e.snap) return e.snap;
    const data = e ? deepFreeze(clone(e.d)) : undefined;
    const s = Object.freeze({ id: idOf(path), exists: !!e, data: () => data, metadata: Object.freeze({ fromCache: false, hasPendingWrites: false }) });
    if (e) e.snap = s;
    return s;
  }

  function testOp(v, op, x) {
    switch (op) {
      case '==': return v === x || (v != null && x != null && typeof v === 'object' && JSON.stringify(v) === JSON.stringify(x));
      case '!=': return !testOp(v, '==', x);
      case '<': return v != null && v < x;
      case '<=': return v != null && v <= x;
      case '>': return v != null && v > x;
      case '>=': return v != null && v >= x;
      case 'in': return Array.isArray(x) && x.indexOf(v) >= 0;
      case 'not-in': return Array.isArray(x) && x.indexOf(v) < 0;
      case 'array-contains': return Array.isArray(v) && v.indexOf(x) >= 0;
      default: return false;
    }
  }
  function runQuery(q) {
    const pre = q.path + '/';
    let rows = [];
    docs.forEach((e, p) => { if (p.indexOf(pre) === 0 && p.indexOf('/', pre.length) < 0) rows.push(p); });
    for (const f of q.filters) rows = rows.filter(p => testOp(docs.get(p).d[f.field], f.op, f.value));
    const id = p => p.slice(pre.length);
    if (q.order) {
      const field = q.order.field, sg = q.order.dir === 'desc' ? -1 : 1;
      rows.sort((a, b) => {
        const va = docs.get(a).d[field], vb = docs.get(b).d[field];
        const ma = va === undefined || va === null, mb = vb === undefined || vb === null;
        if (ma !== mb) return ma ? 1 : -1;
        if (!ma && va !== vb) return (va < vb ? -1 : 1) * sg;
        return (id(a) < id(b) ? -1 : 1) * sg;
      });
    } else rows.sort((a, b) => (id(a) < id(b) ? -1 : 1));
    if (q.lim) rows = rows.slice(0, q.lim);
    return rows;
  }
  function buildQS(q, prev) {
    const rows = runQuery(q);
    const snaps = rows.map(p => docSnap(p));
    const state = new Map();
    rows.forEach((p, i) => state.set(p, { v: docs.get(p).v, i, ds: snaps[i] }));
    const changes = [];
    snaps.forEach((ds, i) => {
      const p = rows[i];
      const old = prev && prev.state.get(p);
      if (!old) changes.push({ type: 'added', doc: ds, oldIndex: -1, newIndex: i });
      else if (old.v !== state.get(p).v) changes.push({ type: 'modified', doc: ds, oldIndex: old.i, newIndex: i });
    });
    if (prev) prev.state.forEach((old, p) => { if (!state.has(p)) changes.push({ type: 'removed', doc: old.ds, oldIndex: old.i, newIndex: -1 }); });
    const ids = rows.join('|');
    const qs = Object.freeze({
      docs: snaps, size: snaps.length, empty: !snaps.length,
      docChanges: () => changes,
      metadata: Object.freeze({ fromCache: false, hasPendingWrites: false }),
    });
    return { qs, state, ids, changed: !prev || changes.length > 0 || prev.ids !== ids };
  }
  function watchQuery(q, next, error) {
    let prev = null, alive = true, queued = false;
    const w = {
      hit: p => p.indexOf(q.path + '/') === 0 && p.indexOf('/', q.path.length + 1) < 0,
      run: () => {
        if (!alive || queued) return;
        queued = true;
        queueMicrotask(() => {
          queued = false;
          if (!alive) return;
          const r = buildQS(q, prev);
          if (r.changed) {
            prev = r;
            try { next(r.qs); } catch (e) { console.error(e); if (error) try { error(e); } catch (e2) { /* ignore */ } }
          }
        });
      },
    };
    watchers.add(w);
    w.run();
    return () => { alive = false; watchers.delete(w); };
  }
  function watchDoc(path, next) {
    let last = -1, alive = true, queued = false;
    const w = {
      hit: p => p === path,
      run: () => {
        if (!alive || queued) return;
        queued = true;
        queueMicrotask(() => {
          queued = false;
          if (!alive) return;
          const e = docs.get(path);
          const v = e ? e.v : 0;
          if (v !== last) { last = v; try { next(docSnap(path)); } catch (err) { console.error(err); } }
        });
      },
    };
    watchers.add(w);
    w.run();
    return () => { alive = false; watchers.delete(w); };
  }

  function mkQuery(path, filters, order, lim) {
    const q = { path, filters, order, lim };
    return {
      where: (field, op, value) => mkQuery(path, filters.concat([{ field, op, value }]), order, lim),
      orderBy: (field, dir) => mkQuery(path, filters, { field, dir: dir || 'asc' }, lim),
      limit: n => mkQuery(path, filters, order, n),
      get: () => Promise.resolve(buildQS(q, null).qs),
      onSnapshot: (next, error) => watchQuery(q, next, error),
    };
  }
  function wr(fn) {
    return new Promise((res, rej) => {
      try { fn(); res(); } catch (e) { rej(e instanceof TypeError ? { code: 'invalid_argument', message: e.message } : e); }
    });
  }
  function assertObj(d) { if (!isObj(d)) throw { code: 'invalid_argument', message: 'Документ должен быть объектом' }; }
  const autoId = () => rid(16);

  function docRef(path) {
    const s = checkPath(path, true);
    return {
      id: s[s.length - 1],
      path,
      get: () => Promise.resolve(docSnap(path)),
      set: data => wr(() => { assertObj(data); put(path, clone(data)); }),
      update: data => wr(() => {
        assertObj(data);
        const e = docs.get(path);
        if (!e) throw { code: 'invalid_argument', message: 'update: документа нет: ' + path };
        put(path, deepMerge(e.d, data));
      }),
      delete: () => wr(() => { if (docs.has(path)) put(path, null); }),
      acquire: o => Promise.resolve({ acquired: true, holder: o && o.holder, expiresAt: new Date(Date.now() + 3e4).toISOString() }),
      onSnapshot: next => watchDoc(path, next),
      collection: sub => collRef(path + '/' + sub),
    };
  }
  function collRef(path) {
    checkPath(path, false);
    const base = mkQuery(path, [], null, 0);
    return Object.assign({}, base, {
      path,
      doc: id => docRef(path + '/' + (id || autoId())),
      add: async data => { const r = docRef(path + '/' + autoId()); await r.set(data); return r; },
    });
  }

  loadAll();
  return {
    doc: p => docRef(p),
    collection: p => collRef(p),
    persistFailed: () => persistFailed,
    has: p => docs.has(p),
    wipe() {
      const keys = Array.from(docs.keys());
      keys.forEach(p => put(p, null));
    },
    parentOf,
  };
}

/* ===== «комната» между вкладками одного браузера (демо-режим) ===== */
function makeLocalRoom(uid) {
  const myId = rid(8);
  let mine = {};
  const peers = new Map();
  const subs = new Set();
  let chan = null;
  try { chan = new BroadcastChannel('soroka:room'); } catch (e) { chan = null; }

  function list() {
    const out = [{ peer: myId, by: uid, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: Object.freeze(Object.assign({}, mine)), updatedAt: Date.now() }];
    peers.forEach((p, id) => out.push({ peer: id, by: p.uid, isMe: p.uid === uid, sameTab: false, kind: 'viewer', guest: false, presence: Object.freeze(p.presence), updatedAt: p.at }));
    return out;
  }
  function fire() {
    const l = list();
    subs.forEach(fn => { try { fn({ peers: l, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } });
  }
  function announce() { try { if (chan) chan.postMessage({ k: 'p', id: myId, uid, presence: mine }); } catch (e) { /* ignore */ } }
  if (chan) {
    chan.onmessage = ev => {
      const m = ev.data;
      if (!m) return;
      if (m.k === 'p') {
        const old = peers.get(m.id);
        const changed = !old || JSON.stringify(old.presence) !== JSON.stringify(m.presence);
        peers.set(m.id, { uid: m.uid, presence: m.presence || {}, at: changed ? Date.now() : old.at, seen: Date.now() });
        if (changed) fire();
      } else if (m.k === 'bye') { if (peers.delete(m.id)) fire(); }
      else if (m.k === 'hello') announce();
    };
    setInterval(() => {
      announce();
      let dropped = false;
      peers.forEach((p, id) => { if (Date.now() - p.seen > 9000) { peers.delete(id); dropped = true; } });
      if (dropped) fire();
    }, 3000);
    window.addEventListener('pagehide', () => { try { chan.postMessage({ k: 'bye', id: myId }); } catch (e) { /* ignore */ } });
    try { chan.postMessage({ k: 'hello' }); } catch (e) { /* ignore */ }
  }
  return {
    presence(patch) {
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      announce();
      fire();
      return Promise.resolve();
    },
    onPeers(fn) { subs.add(fn); queueMicrotask(() => { try { fn({ peers: list(), joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } }); return () => subs.delete(fn); },
    peers: list,
    connected: () => true,
    onConnection(fn) { fn(true); return () => {}; },
  };
}

/* ===== присутствие: «в сети» и «печатает…» ===== */
const Presence = {
  room: null, online: new Set(), typing: new Map(), synth: new Map(), subs: new Set(),
  lastTyping: 0, tt: 0, sig: '', timer: 0,
  init(room) {
    this.room = room;
    if (room) {
      try { room.onPeers(ch => this.recompute(ch.peers), () => {}); } catch (e) { /* ignore */ }
      this.push({ u: S.uid, vis: !document.hidden });
    }
    if (!this.timer) this.timer = setInterval(() => this.tick(), 1500);
  },
  push(patch) {
    if (!this.room) return;
    try { const p = this.room.presence(patch); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
  },
  recompute(peers) {
    const on = new Set(), ty = new Map();
    (peers || []).forEach(p => {
      if (p.kind && p.kind !== 'viewer') return;
      const u = p.by || (p.presence && p.presence.u);
      if (!u || u === S.uid) return;
      const pr = p.presence || {};
      if (pr.vis !== false) on.add(u);
      if (pr.tc && pr.ty) ty.set(u, { cid: pr.tc, at: p.updatedAt || Date.now() });
    });
    this.online = on;
    this.typing = ty;
    this.sig = this.signature();
    this.fire();
  },
  active() {
    const now = Date.now(), out = [];
    this.typing.forEach((t, u) => { if (now - t.at < 5500) out.push(u + '@' + t.cid); });
    this.synth.forEach((t, u) => { if (t.typing && now < t.typing.until) out.push(u + '@' + t.typing.cid); });
    return out.sort();
  },
  signature() { return this.active().join(',') + '|' + Array.from(this.online).sort().join(','); },
  tick() {
    const s = this.signature();
    if (s !== this.sig) { this.sig = s; this.fire(); }
  },
  fire() { this.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); },
  isOnline(uid) {
    if (uid === S.uid) return true;
    if (uid === 'bot') return true;
    const sy = this.synth.get(uid);
    return this.online.has(uid) || !!(sy && sy.online);
  },
  typingIn(cid) {
    const now = Date.now(), out = [];
    this.typing.forEach((t, u) => { if (t.cid === cid && now - t.at < 5500) out.push(u); });
    this.synth.forEach((t, u) => { if (t.typing && t.typing.cid === cid && now < t.typing.until) out.push(u); });
    return out;
  },
  setTyping(cid) {
    const now = Date.now();
    if (now - this.lastTyping > 2500) { this.lastTyping = now; this.push({ tc: cid, ty: now }); }
    clearTimeout(this.tt);
    this.tt = setTimeout(() => this.clearTyping(), 4000);
  },
  clearTyping() {
    clearTimeout(this.tt);
    if (this.lastTyping) { this.lastTyping = 0; this.push({ tc: null, ty: null }); }
  },
  setVisible(v) { this.push({ vis: !!v }); },
};

/* ===== звук ===== */
let actx = null;
function playBlip() {
  if (!S.set.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    [[784, 0], [1175, 0.09]].forEach(pair => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = pair[0];
      g.gain.setValueAtTime(0.0001, t + pair[1]);
      g.gain.exponentialRampToValueAtTime(0.12, t + pair[1] + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + pair[1] + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(t + pair[1]); o.stop(t + pair[1] + 0.25);
    });
  } catch (e) { /* ignore */ }
}

/* ленту обновляем по ключам: неизменённые пузыри остаются в DOM */
function reconcile(container, items) {
  const existing = new Map();
  Array.from(container.children).forEach(ch => { if (ch.dataset.key) existing.set(ch.dataset.key, ch); });
  const next = items.map(it => {
    const el = existing.get(it.key);
    if (el && el.dataset.sig === it.sig) return el;
    const n = it.build();
    n.dataset.key = it.key;
    n.dataset.sig = it.sig;
    return n;
  });
  const keep = new Set(next);
  Array.from(container.children).forEach(ch => { if (!keep.has(ch)) ch.remove(); });
  let ref = container.firstElementChild;
  next.forEach(el => {
    if (el === ref) ref = ref.nextElementSibling;
    else container.insertBefore(el, ref);
  });
}

let lpTimer = 0;
function bindMsgEvents(el, m) {
  const skip = t => !!(t.closest && t.closest('a, .spoiler, .media, .rx, .q, .tools, .nm, .m-av'));
  el.addEventListener('contextmenu', e => {
    if (skip(e.target)) return;
    e.preventDefault();
    openMsgMenu(m, e.clientX, e.clientY);
  });
  let start = null;
  const cancel = () => { clearTimeout(lpTimer); lpTimer = 0; start = null; };
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || skip(e.target)) return;
    start = { x: e.clientX, y: e.clientY };
    clearTimeout(lpTimer);
    lpTimer = setTimeout(() => { const s = start; cancel(); if (s) { openMsgMenu(m, s.x, s.y); try { if (navigator.vibrate) navigator.vibrate(10); } catch (err) { /* ignore */ } } }, 480);
  });
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('pointermove', e => { if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 12) cancel(); });
}

function computeAnchor(list) {
  S.anchor = null;
  if (!S.cur || !S.cur.cid) return;
  const r = S.readAtOpen || { t: 0 };
  const first = list.find(m => m.u !== S.uid && m.k !== 'sys' && m.t > r.t);
  S.anchor = first ? first.id : null;
}
function renderThread(opts) {
  opts = opts || {};
  const box = $('#msgs'), th = $('#thread');
  if (!S.cur || !box || !th) return;
  const list = visibleMsgs();
  const prevH = box.scrollHeight, prevTop = box.scrollTop;
  const wasBottom = prevH - prevTop - box.clientHeight < 90;
  const prevLast = S.lastId;
  if (opts.initial) computeAnchor(list);
  const items = [];
  if (S.hasMore) items.push({ key: 'more', sig: 'more', build: loadMoreEl });
  let lastDay = '';
  list.forEach((m, i) => {
    const prev = list[i - 1], next = list[i + 1];
    const dk = dayKey(m.t);
    if (dk !== lastDay) { lastDay = dk; items.push({ key: 'day:' + dk, sig: dk + dayLabel(m.t), build: () => h('div', { class: 'day', text: dayLabel(m.t) }) }); }
    if (S.anchor === m.id) items.push({ key: 'unread', sig: 'u', build: () => h('div', { class: 'unread-div', text: 'Непрочитанные сообщения' }) });
    const f = { prev: sameRun(prev, m), next: sameRun(m, next) };
    f.big = !m.img && m.k !== 'sys' && !m.streaming && bigEmoji(m.x);
    const st = statusFor(m);
    items.push({ key: 'm:' + m.id, sig: sigOf(m, f, st), build: () => msgEl(m, f, st) });
  });
  reconcile(th, items);
  const last = list[list.length - 1];
  S.lastId = last ? last.id : null;
  if (opts.initial) {
    S.initialPending = false;
    scrollInitial();
  } else if (opts.older) {
    box.scrollTop = prevTop + (box.scrollHeight - prevH);
  } else {
    const ownNew = last && last.id !== prevLast && last.u === S.uid;
    if (wasBottom || ownNew) box.scrollTop = box.scrollHeight;
    else if (last && prevLast && last.id !== prevLast && last.u !== S.uid) S.below++;

  syncScroll();
  if (S.find.open) applyFind(false);
}
function scrollInitial() {

  }

}
function onMsgsChanged(snap) {
  const real = !snap || !snap.metadata || snap.metadata.fromCache === false || snap.size > 0;
  const initial = S.initialPending && real;
  const older = S.loadingOlder;

/* ===== действия: отправка, правка, удаление, реакции ===== */
const msgRefOf = id => msgCollection(S.cur).doc(id);
const lastN = () => S.msgs.reduce((a, m) => Math.max(a, m.n || 0), 0);
function nextTs() {
  const lastT = S.msgs.length ? S.msgs[S.msgs.length - 1].t : 0;
  return Math.min(Math.max(Date.now(), lastT + 1), Date.now() + 120000);
}
const lastOf = m => ({ i: m.id, u: m.u, t: m.t, n: m.n || 0, k: m.img ? 'img' : 'text', x: previewTextOf(m) });
const chatRefOf = cid => S.db.doc('chats/' + cid);

async function sendMessage(o) {
  const cur = S.cur;
  const t = nextTs();
  const id = newMid();
  const msg = { u: S.uid, t, x: o.text || '' };
  if (o.reply) { msg.r = o.reply.id; msg.rq = { u: o.reply.u, x: o.reply.x }; }
  if (o.img) {
    const bid = newMid();
    await writeBlob(bid, o.img);
    msg.img = { b: bid, w: o.img.w, h: o.img.h, p: o.img.p };
  }
  if (cur.cid) {
    const chat = S.chats.get(cur.cid);
    msg.n = ((chat && chat.last && chat.last.n) || lastN()) + 1;
    const last = lastOf(Object.assign({ id }, msg));
    if (!chat) {
      await serial('chat:' + cur.cid, () => chatRefOf(cur.cid).set({ k: 'dm', members: [S.uid, cur.peerId], at: t, by: S.uid, last }));
    } else {
      serial('chat:' + cur.cid, () => chatRefOf(cur.cid).update({ last })).catch(e => console.warn('last', e));
    }
    await S.db.doc('chats/' + cur.cid + '/m/' + id).set(msg);
  } else {
    msg.n = 0;
    await msgCollection(cur).doc(id).set(msg);
  }
  return Object.assign({ id }, msg);
}
let submitting = false;
async function submitComposer() {
  if (!S.cur || !S.canWrite || submitting) return;
  const ta = $('#ta');
  const text = ta.value.trim();
  if (S.edit) { await commitEdit(text); return; }
  const att = S.attach;
  if (!text && !att) return;
  if (S.cur.kind === 'bot') { await botSend(text); return; }
  const reply = S.reply;
  submitting = true;
  ta.value = '';
  autosize();
  S.reply = null; S.attach = null;
  setDraft(S.cur.key, '');
  renderComposer();
  toggleEmoji(false);
  Presence.clearTyping();
  try {
    const sent = await sendMessage({ text, img: att, reply });
    if (S.mode === 'demo') demoAfterSend(S.cur, sent);
  } catch (e) {
    console.warn('send', e);
    toast(errText(e, 'Не удалось отправить'), { err: true });
    if (!ta.value) { ta.value = text; autosize(); }
    if (!S.attach) S.attach = att;
    if (!S.reply) S.reply = reply;
    renderComposer();
  } finally { submitting = false; }
}
async function commitEdit(text) {
  const m = S.edit;
  if (!m) return;
  if (!text && !m.img) { toast('Сообщение не может быть пустым. Удалите его через меню.'); return; }
  if (text === (m.x || '')) { cancelEdit(); return; }
  const cur = S.cur;
  S.edit = null;
  const ta = $('#ta');
  ta.value = getDraft(cur.key);
  autosize();
  renderComposer();
  try {
    await msgRefOf(m.id).update({ x: text, e: Date.now() });
    const chat = cur.cid && S.chats.get(cur.cid);
    if (chat && chat.last && chat.last.i === m.id) {
      const last = Object.assign({}, chat.last, { x: previewTextOf({ x: text, img: m.img }) });
      serial('chat:' + cur.cid, () => chatRefOf(cur.cid).update({ last })).catch(() => {});
    }
    if (chat && chat.pin && chat.pin.i === m.id) {
      const pin = Object.assign({}, chat.pin, { x: previewTextOf({ x: text, img: m.img }) });
      serial('chat:' + cur.cid, () => chatRefOf(cur.cid).update({ pin })).catch(() => {});
    }
  } catch (e) { toast(errText(e, 'Не удалось изменить'), { err: true }); }
}
async function deleteMessage(m) {
  const cur = S.cur;
  const shared = cur.kind === 'dm' || cur.kind === 'g';
  const ok = await confirmDialog({ title: 'Удалить сообщение?', text: shared ? 'Оно исчезнет у всех участников чата.' : 'Сообщение будет удалено.', ok: 'Удалить', danger: true });
  if (!ok) return;
  try {
    await msgRefOf(m.id).delete();
    if (m.img) S.db.doc('blobs/' + m.img.b).delete().catch(() => {});
    const chat = cur.cid && S.chats.get(cur.cid);
    if (chat && chat.last && chat.last.i === m.id) {
      const idx = S.msgs.findIndex(x => x.id === m.id);
      const prev = S.msgs.slice(0, Math.max(0, idx)).reverse().find(x => x.k !== 'sys');
      const last = prev ? lastOf(prev) : { i: '', u: '', t: chat.at || 0, n: 0, k: 'text', x: '' };
      serial('chat:' + cur.cid, () => chatRefOf(cur.cid).update({ last })).catch(() => {});
    }
    if (chat && chat.pin && chat.pin.i === m.id) pinMessage(null);
  } catch (e) { toast(errText(e, 'Не удалось удалить'), { err: true }); }
}
async function toggleReaction(m, emo) {
  if (!S.canWrite || !S.cur) return;
  const has = hasMyRx(m, emo);
  try { await msgRefOf(m.id).update({ rx: { [emo]: { [S.uid]: has ? 0 : 1 } } }); }
  catch (e) { toast(errText(e, 'Не удалось поставить реакцию'), { err: true }); }
}
async function pinMessage(m) {
  const model = curModel();
  if (!model || !model.chat) return;
  const cid = model.cid;
  const pin = m ? { i: m.id, x: previewTextOf(m), u: m.u } : { i: '', x: '', u: '' };

    await serial('chat:' + cid, () => chatRefOf(cid).update({ pin }));

}

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res({ img, w: img.naturalWidth, h: img.naturalHeight }); URL.revokeObjectURL(url); };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ message: 'Не удалось открыть изображение' }); };
    img.src = url;
  });
}
async function prepareImage(file) {
  if (!file || !/^image\//.test(file.type)) throw { message: 'Выберите изображение' };
  if (file.size > 30 * 1024 * 1024) throw { message: 'Файл слишком большой' };
  const src = await loadBitmap(file);
  if (!src.w || !src.h) throw { message: 'Пустое изображение' };
  const maxChars = S.mode === 'remote' ? 170000 : 70000;
  let maxSide = S.mode === 'remote' ? 1280 : 800;
  let q = 0.8, out = null;
  for (let i = 0; i < 12 && !out; i++) {
    const sc = Math.min(1, maxSide / Math.max(src.w, src.h));
    const w = Math.max(1, Math.round(src.w * sc)), hh = Math.max(1, Math.round(src.h * sc));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = hh;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, hh);
    cx.drawImage(src.img, 0, 0, w, hh);
    const data = cv.toDataURL('image/jpeg', q);
    if (data.length <= maxChars) out = { data, w, h: hh, size: Math.round(data.length * 0.75) };
    else if (q > 0.5) q -= 0.1;
    else maxSide = Math.round(maxSide * 0.8);
  }
  if (!out) throw { message: 'Не удалось сжать фото' };
  const tw = 24, th = Math.max(1, Math.round(24 * out.h / out.w));
  const tc = document.createElement('canvas');
  tc.width = tw; tc.height = th;
  tc.getContext('2d').drawImage(src.img, 0, 0, tw, th);
  out.p = tc.toDataURL('image/jpeg', 0.5);
  return out;
}
async function attachFile(file) {
  if (!S.cur || !S.canWrite || S.cur.kind === 'bot') return;
  try {
    S.attach = await prepareImage(file);

}

async function purgeCollection(coll, withBlobs) {
  let guard = 0;
  for (;;) {
    const snap = await coll.limit(100).get();
    if (snap.empty || guard++ > 200) break;
    const docs = snap.docs.slice();
    for (let i = 0; i < docs.length; i += 8) {
      await Promise.all(docs.slice(i, i + 8).map(d => {
        const data = d.data() || {};
        if (withBlobs && data.img && data.img.b) S.db.doc('blobs/' + data.img.b).delete().catch(() => {});
        return coll.doc(d.id).delete().catch(() => {});
      }));
    }
  }
}

const BOT_PROMPT = 'Ты — Помощник внутри мессенджера «Сорока». Отвечай по-русски, если собеседник не пишет на другом языке. Пиши коротко и по делу, как в переписке: обычно 1–4 предложения, без заголовков и длинных списков. Из разметки доступны **жирный**, __курсив__ и `код`. Если не знаешь ответа, так и скажи.';
const botRender = raf1(() => { if (S.cur && S.cur.kind === 'bot') renderThread({ soft: true }); });
function maybeWelcomeBot(empty) {
  if (!empty || LS.get(K('welcomed'), false) || !S.paths) return;
  LS.set(K('welcomed'), 1);
  const t = Date.now();
  const a = S.mode === 'demo'
    ? 'Привет! Это демо «Сороки»: контакты и чаты вымышленные и хранятся только в этом браузере. Откройте страницу из своего аккаунта Claude, чтобы переписываться с реальными людьми.'
    : 'Привет! Я Помощник внутри «Сороки». Спрашивайте о чём угодно: помогу с текстом, идеей или планом.';
  const b = S.mode === 'demo'
    ? 'Попробуйте написать Але, Тихону или Вере: они ответят заготовленными фразами. Можно ставить реакции, отвечать на сообщения и прикреплять фото.'
    : 'Чтобы переписываться с друзьями, нажмите карандаш над списком чатов. Люди появятся там после первого входа на страницу. Дайте им доступ «Участник» через «Поделиться», иначе они смогут только читать.';
  S.paths.bot.doc(newMid()).set({ u: 'bot', t, x: a, n: 0 }).catch(() => {});
  S.paths.bot.doc(newMid()).set({ u: 'bot', t: t + 1, x: b, n: 0 }).catch(() => {});
}
function botErr(e) {
  const c = e && e.code;
  if (c === 'not_granted') return 'Помощник недоступен: нет разрешения.';
  if (c === 'rate_limited') return 'Слишком часто. Подождите немного.';
  if (e && e.name === 'AbortError') return '';
  return 'Не удалось получить ответ.';
}
async function botSend(text) {
  const ta = $('#ta');
  ta.value = '';
  autosize();
  setDraft('bot', '');
  S.reply = null;
  renderComposer();
  const id = newMid();
  try { await S.paths.bot.doc(id).set({ u: S.uid, t: nextTs(), x: text, n: 0 }); }
  catch (e) { toast(errText(e, 'Не удалось отправить'), { err: true }); ta.value = text; autosize(); updateSendState(); return; }
  await runBot(text, id);
}
async function runBot(text, excludeId) {
  S.tmp = { t: Date.now(), x: '', streaming: true };
  renderThread({ soft: true });
  renderChatHead();
  if (typeof S.sample !== 'function') {
    await sleep(700);
    S.tmp = null;
    const reply = 'В демо-режиме я отвечаю заготовкой. Откройте страницу из аккаунта Claude, и я смогу отвечать по-настоящему.';
    try { await S.paths.bot.doc(newMid()).set({ u: 'bot', t: nextTs(), x: reply, n: 0 }); } catch (e) { /* ignore */ }
    renderChatHead();
    return;
  }
  const hist = S.msgs.filter(m => m.k !== 'sys' && m.x && m.id !== excludeId).slice(-14).map(m => ({ role: m.u === 'bot' ? 'assistant' : 'user', content: m.x }));
  hist.push({ role: 'user', content: text });
  const merged = [];
  hist.forEach(x => {
    const l = merged[merged.length - 1];
    if (l && l.role === x.role) l.content += '\n' + x.content; else merged.push({ role: x.role, content: x.content });
  });
  while (merged.length && merged[0].role !== 'user') merged.shift();
  merged[0].content = BOT_PROMPT + '\n\n---\n' + merged[0].content;
  const ctl = new AbortController();
  S.botCtl = ctl;
  try {
    const res = await S.sample(merged, {
      cache: false, modelTier: 'quick', signal: ctl.signal,
      onText: p => { if (S.tmp) { S.tmp.x = p.text; botRender(); } },
    });
    const final = String((res && res.text) || '').trim();
    S.tmp = null;
    if (final) await S.paths.bot.doc(newMid()).set({ u: 'bot', t: nextTs(), x: final, n: 0 });
    else { S.tmp = { t: Date.now(), x: '', streaming: false, err: 'Пустой ответ.', retry: text }; }
  } catch (e) {
    const msg = botErr(e);
    S.tmp = msg ? { t: Date.now(), x: '', streaming: false, err: msg, retry: text } : null;
  }
  S.botCtl = null;
  if (S.cur && S.cur.kind === 'bot') renderThread({ soft: true });
  renderChatHead();
  renderSidebar();
}
function retryBot() {
  const t = S.tmp && S.tmp.retry;
  S.tmp = null;
  if (t) runBot(t, null);
}

  /* профиль */
  let prof = null;
  try { const snap = await withTimeout(S.db.doc('users/' + S.uid).get(), 12000, 'users'); prof = snap.exists ? snap.data() : null; }
  catch (e) { showInfoGate('Нет связи', 'Не удалось связаться с хранилищем страницы. Проверьте соединение и попробуйте ещё раз.', ['Повторить', () => { const g = $('#gate'); if (g) g.remove(); boot(); }]); return; }
  if (!prof) {
    if (!S.canWrite) { showInfoGate('Только для чтения', 'У вас доступ к странице только для просмотра. Попросите владельца дать право «Участник», и вы сможете переписываться.'); return; }
    if (S.mode === 'demo' && !(TEST && TEST.onboard)) {
      const d = { n: (TEST && TEST.name) || 'Вы', a: '', c: 3, e: '', s: Date.now(), v: 1 };
      await S.db.doc('users/' + S.uid).set(d);
      prof = d;
    } else {
      let init = {};
      if (S.userCap) { try { const me = await S.userCap.me(); if (me && me.name) init.n = String(me.name).slice(0, 32); } catch (e) { /* ignore */ } }
      if (TEST && TEST.name) init.n = TEST.name;
      await showProfileGate(init);
      prof = S.users.get(S.uid) || (S.me && { n: S.me.n, a: S.me.a, c: S.me.c, e: S.me.e });
    }
  }
  S.me = Object.assign({ id: S.uid }, prof);
  S.users.set(S.uid, prof);
  enterApp();
}
async function enterApp() {
  if (S.mode === 'demo' && !(TEST && TEST.noSeed)) await seedDemo();
  S.ready = true;
  Presence.init(S.room);
  startData();
  const net = $('#net');
  if (S.mode === 'demo') { net.hidden = false; net.textContent = 'Демо: чаты вымышленные и хранятся только в этом браузере.'; }
  $('#app').classList.remove('booting');
  $('#btn-new').hidden = !S.canWrite;
  renderSidebarNow();
  updateTitle();
  window.__soroka = { S, openConv, openDm, toast };
}

/* ===== события ===== */
let eventsWired = false;
function wireEvents() {
  if (eventsWired) return;
  eventsWired = true;
  $('#btn-new').addEventListener('click', () => openNewChat());
  $('#btn-set').addEventListener('click', () => openSettings());
  $('#q').addEventListener('input', e => { S.q = e.target.value; renderSidebarNow(); });
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { S.tab = b.dataset.tab; renderSidebarNow(); } });
  $('#btn-back').addEventListener('click', () => closeConv());
  $('#btn-who').addEventListener('click', () => toggleInfo());
  $('#btn-info').addEventListener('click', () => toggleInfo());
  $('#btn-find').addEventListener('click', () => (S.find.open ? closeFind() : openFind()));
  $('#fclose').addEventListener('click', closeFind);
  $('#fprev').addEventListener('click', () => stepFind(-1));
  $('#fnext').addEventListener('click', () => stepFind(1));
  const loadWide = debounce(() => { if (S.hasMore && S.limit < 400 && S.find.q.trim()) { S.limit = 400; subscribeMsgs(); } }, 500);
  $('#fq').addEventListener('input', e => { S.find.q = e.target.value; S.find.i = -1; runFind(true); loadWide(); });
  $('#fq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? 1 : -1); } });

  const msgs = $('#msgs');
  const readSoon = debounce(markRead, 250);
  msgs.addEventListener('scroll', () => { syncScroll(); readSoon(); }, { passive: true });
  $('#tobottom').addEventListener('click', () => scrollToBottom(true));
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => { if (S.atBottom && S.cur) msgs.scrollTop = msgs.scrollHeight; });
    ro.observe($('#thread'));
    ro.observe(msgs);
  }

  const ta = $('#ta');
  const saveDraftSoon = debounce(() => { if (S.cur && !S.edit) setDraft(S.cur.key, ta.value); renderSidebar(); }, 350);
  ta.addEventListener('input', () => {
    autosize(); updateSendState(); saveDraftSoon();
    if (S.cur && S.cur.cid && ta.value && !S.edit) Presence.setTyping(S.cur.cid);
  });
  ta.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Enter') {
      const ctrl = e.ctrlKey || e.metaKey;
      const send = S.set.send === 'ctrl' ? ctrl : (!e.shiftKey && !isTouch());
      if (send) { e.preventDefault(); submitComposer(); }
    } else if (e.key === 'ArrowUp' && !ta.value && !S.edit) {
      const mine = S.msgs.slice().reverse().find(m => m.u === S.uid && m.k !== 'sys' && S.cur.kind !== 'bot');
      if (mine) { e.preventDefault(); startEdit(mine); }
    }
  });
  ta.addEventListener('paste', e => {
    const f = Array.from((e.clipboardData && e.clipboardData.files) || []).find(x => /^image\//.test(x.type));
    if (f) { e.preventDefault(); attachFile(f); }
  });
  $('#btn-send').addEventListener('click', () => submitComposer());
  $('#btn-clip').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) attachFile(f); });
  $('#btn-emo').addEventListener('click', e => { e.stopPropagation(); toggleEmoji(); });
  document.addEventListener('pointerdown', e => {
    const p = $('#emoji');
    if (!p.hidden && !e.target.closest('#emoji') && !e.target.closest('#btn-emo')) toggleEmoji(false);
  });
  const chat = $('#chat');
  chat.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0) e.preventDefault(); });
  chat.addEventListener('drop', e => {
    const f = Array.from((e.dataTransfer && e.dataTransfer.files) || []).find(x => /^image\//.test(x.type));
    if (f) { e.preventDefault(); attachFile(f); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#layer .menu')) { closeMenu(); return; }
      const lb = $('#layer .lightbox'); if (lb) { lb.remove(); return; }
      if (modals.length) { modals[modals.length - 1].close(); return; }
      if (!$('#emoji').hidden) { toggleEmoji(false); return; }
      if (S.edit) { cancelEdit(); return; }
      if (S.reply) { cancelReply(); return; }
      if (S.find.open) { closeFind(); return; }
      if (S.info) { toggleInfo(false); return; }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  });
  document.addEventListener('visibilitychange', () => {
    Presence.setVisible(!document.hidden);
    if (document.hidden) {
      if (S.ready && S.canWrite && S.me) S.db.doc('users/' + S.uid).update({ s: Date.now() }).catch(() => {});
    } else { markRead(); renderSidebar(); updateTitle(); }
  });
  window.addEventListener('pagehide', () => { if (S.ready && S.canWrite && S.me) S.db.doc('users/' + S.uid).update({ s: Date.now() }).catch(() => {}); });
  if (window.visualViewport) {
    const fit = () => {
      const vv = window.visualViewport;
      const app = $('#app');
      if (vv.height < window.innerHeight - 120) app.style.height = vv.height + 'px'; else app.style.height = '';
    };
    window.visualViewport.addEventListener('resize', fit);
  }
}

boot();


})();
</script>

</body></html>
